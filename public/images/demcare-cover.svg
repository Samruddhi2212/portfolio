<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 680 430" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>DemCare — holistic mobile application for dementia patients</title>
<desc>A phone running the DemCare app sits beside its three features: adaptive cognitive games, GPS safe-zone alerts, and a voice-to-text diary. Colour-coded behavioural events from all three stream into a pipeline that cleans and builds features, producing an ML-ready feature matrix that feeds a risk model. Badges report over ten thousand events per day, 95 percent signal consistency, 75 percent higher engagement and 80 percent faster alerts.</desc>
