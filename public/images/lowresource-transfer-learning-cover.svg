<rect x="500" y="120" width="140" height="110" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<g stroke="#B4B2A9" stroke-width="1" fill="none"><path d="M516 132 V216 H632"/></g>
<path d="M516 216 L630 134" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"/>
<path d="M516 216 C 546 194, 570 172, 630 136" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round"/>
<path d="M516 216 C 534 176, 562 150, 630 136" fill="none" stroke="#7F77DD" stroke-width="2" stroke-linecap="round"/>
<path d="M516 216 C 522 152, 546 138, 630 136" fill="none" stroke="#0F6E56" stroke-width="2.4" stroke-linecap="round"/>

<text x="40" y="262" font-size="12" fill="#5F5E5A">5-fold cross-validation</text>
<rect x="210" y="253" width="10" height="9" rx="2" fill="#E4E1D8"/>
