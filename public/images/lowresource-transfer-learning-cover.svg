<rect x="238" y="120" width="90" height="110" rx="12" fill="#CECBF6" stroke="#534AB7" stroke-width="0.8"/>
<g fill="#7F77DD"><rect x="248" y="136" width="70" height="12" rx="3" opacity="0.95"/><rect x="252" y="158" width="62" height="12" rx="3" opacity="0.8"/><rect x="256" y="180" width="54" height="12" rx="3" opacity="0.65"/><rect x="260" y="202" width="46" height="12" rx="3" opacity="0.5"/></g>

<path d="M332 175 H354" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

