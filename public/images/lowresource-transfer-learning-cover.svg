<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 680 430" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Low-resource medical imaging via transfer learning</title>
<desc>Three pretraining sources — random initialisation, ImageNet, and medical-domain scans — feed one CNN backbone, which is fine-tuned on a target set of roughly 300 scans and evaluated with ROC curves. Below, a five-fold cross-validation strip and a result card reporting 92.02 percent accuracy, 0.9875 AUC and a 14 percent gain over training from scratch.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="430" fill="#FBF9F5"/>

<text x="40" y="46" font-size="20" font-weight="500" fill="#2C2C2A">Low-resource medical imaging</text>
<text x="40" y="66" font-size="12" fill="#5F5E5A">transfer learning under extreme data scarcity</text>

<g>
<circle cx="598" cy="46" r="15" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
<path d="M609 57 L620 68" stroke="#534AB7" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="593" cy="46" rx="3.5" ry="6" fill="#5DCAA5"/>
<ellipse cx="603" cy="46" rx="3.5" ry="6" fill="#5DCAA5"/>
<path d="M598 39 V53" stroke="#0F6E56" stroke-width="1.2"/>
</g>

