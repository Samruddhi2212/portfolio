<rect x="52" y="114" width="20" height="20" rx="4" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="3 2"/>
<g fill="#B4B2A9"><circle cx="58" cy="120" r="1.6"/><circle cx="66" cy="124" r="1.6"/><circle cx="60" cy="129" r="1.6"/></g>
<text x="86" y="128" font-size="12" font-weight="500" fill="#444441">from scratch</text>

<rect x="40" y="152" width="160" height="40" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<g><rect x="52" y="162" width="9" height="9" rx="2" fill="#97C459"/><rect x="63" y="162" width="9" height="9" rx="2" fill="#85B7EB"/><rect x="52" y="173" width="9" height="9" rx="2" fill="#EF9F27"/><rect x="63" y="173" width="9" height="9" rx="2" fill="#F0997B"/></g>
<text x="86" y="176" font-size="12" font-weight="500" fill="#3C3489">ImageNet</text>

<rect x="40" y="200" width="160" height="40" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<g><rect x="52" y="210" width="14" height="20" rx="2" fill="#9FE1CB"/><ellipse cx="59" cy="220" rx="3.5" ry="6" fill="#1D9E75"/><rect x="68" y="210" width="14" height="20" rx="2" fill="#9FE1CB"/><ellipse cx="75" cy="220" rx="3.5" ry="6" fill="#1D9E75"/></g>
<text x="88" y="224" font-size="12" font-weight="500" fill="#085041">medical scans</text>
<path d="M0 -5 L1.4 -1.4 L5 0 L1.4 1.4 L0 5 L-1.4 1.4 L-5 0 L-1.4 -1.4 Z" transform="translate(186,220)" fill="#EF9F27"/>

