<rect x="368" y="168" width="30" height="30" rx="3" fill="#E1F5EE"/><ellipse cx="377" cy="183" rx="4" ry="8" fill="#5DCAA5"/><ellipse cx="389" cy="183" rx="4" ry="8" fill="#9FE1CB"/><path d="M383 173 V193" stroke="#5DCAA5" stroke-width="1"/>
<rect x="402" y="168" width="30" height="30" rx="3" fill="#E1F5EE"/><ellipse cx="411" cy="183" rx="4" ry="8" fill="#9FE1CB"/><ellipse cx="423" cy="183" rx="4" ry="8" fill="#5DCAA5"/><path d="M417 173 V193" stroke="#5DCAA5" stroke-width="1"/>
<rect x="436" y="168" width="30" height="30" rx="3" fill="#E1F5EE"/><ellipse cx="445" cy="183" rx="4" ry="8" fill="#9FE1CB"/><ellipse cx="457" cy="183" rx="4" ry="8" fill="#9FE1CB"/><path d="M451 173 V193" stroke="#5DCAA5" stroke-width="1"/>
</g>
<text x="415" y="218" font-size="11" fill="#888780" text-anchor="middle">fine-tune</text>

<path d="M474 175 H496" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

