<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="840" viewBox="0 0 680 420" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Building a vision transformer from scratch for urban change detection</title>
<desc>A small satellite images an urban block at two dates. Empty plots in the before tile become new buildings in the after tile. Both tiles are split into patches and passed through two identical siamese ViT encoder stacks with shared weights, their features are differenced, upsampled by a decoder, and turned into a change mask coloured for correct change, false alarms and missed change. A badge reports validation F1 0.82 and IoU 0.70 on LEVIR-CD.</desc>
